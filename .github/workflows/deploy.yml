name: Deploy SIM Mahasiswa to Canis-Major (Zero-Registry Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get GitHub Actions Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Whitelist IP on DigitalOcean Firewall
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            -d '{"inbound_rules": [{"protocol": "tcp", "ports": "${{ secrets.SERVER_PORT }}", "sources": {"addresses": ["${{ steps.ip.outputs.ipv4 }}/32"]}}]}' \
            "https://api.digitalocean.com/v2/firewalls/${{ secrets.DO_FIREWALL_ID }}/rules"
          sleep 10

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally in Runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: sim-mahasiswa-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export and Compress Docker Image
        run: docker save sim-mahasiswa-web:latest | gzip > /tmp/sim-mahasiswa-web.tar.gz

      - name: Copy Docker Image to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "/tmp/sim-mahasiswa-web.tar.gz"
          target: "/tmp"
          strip_components: 1
          overwrite: true

      - name: Load Image and Restart Container on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            docker load < /tmp/sim-mahasiswa-web.tar.gz
            rm -f /tmp/sim-mahasiswa-web.tar.gz
            cd ~/docker-services/sim-mahasiswa
            docker compose up -d --force-recreate
            docker image prune -f

      - name: Remove IP from DigitalOcean Firewall
        if: always()
        run: |
          curl -X DELETE \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            -d '{"inbound_rules": [{"protocol": "tcp", "ports": "${{ secrets.SERVER_PORT }}", "sources": {"addresses": ["${{ steps.ip.outputs.ipv4 }}/32"]}}]}' \
            "https://api.digitalocean.com/v2/firewalls/${{ secrets.DO_FIREWALL_ID }}/rules"

      - name: Notify Arisu
        if: always()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          JOB_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.repository }}
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MESSAGE" \
            --arg status "$JOB_STATUS" \
            --arg repo "$REPO_NAME" \
            '{commit_message: $msg, status: $status, repository: $repo}')
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BOT_AUTH_TOKEN }}" \
            -d "$JSON_PAYLOAD" \
            "${{ secrets.BOT_WEBHOOK_URL }}"